name: Add chat status indicator

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard.html'
      - '.github/workflows/chat-status-indicator.yml'

permissions:
  contents: write

jobs:
  inject-status-indicator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject status indicator
        shell: python
        run: |
          from pathlib import Path

          path = Path('dashboard.html')
          text = path.read_text(encoding='utf-8')
          marker = 'data-star-status-indicator="v1"'

          if marker in text:
              print('Status indicator already installed.')
              raise SystemExit(0)

          script = r'''<script data-star-status-indicator="v1">
          (() => {
            const messages = () => document.getElementById('messagesInner');
            let active = null;

            function showStatus(kind, label) {
              hideStatus();
              const root = messages();
              if (!root) return;
              const box = document.createElement('div');
              box.className = 'msg ai star-status-message';
              box.setAttribute('role', 'status');
              box.setAttribute('aria-live', 'polite');
              box.innerHTML = '<span class="star-status-dot"></span><span class="star-status-label"></span><span class="star-status-pulse"><i></i><i></i><i></i></span>';
              box.dataset.kind = kind;
              box.querySelector('.star-status-label').textContent = label;
              root.appendChild(box);
              active = box;
              const scroller = document.getElementById('messages');
              if (scroller) scroller.scrollTop = scroller.scrollHeight;
            }

            function hideStatus() {
              if (active && active.isConnected) active.remove();
              active = null;
            }

            function requestKind(url) {
              const value = String(url || '');
              if (value.includes('/api/image-edit')) return ['edit', '✦ يعدّل الصورة الآن'];
              if (value.includes('/api/chat')) return ['think', '✦ يفكّر ويكتب الآن'];
              return null;
            }

            const originalFetch = window.fetch;
            window.fetch = async function(input, init) {
              const url = typeof input === 'string' ? input : (input && input.url) || '';
              const kind = requestKind(url);
              if (kind) showStatus(kind[0], kind[1]);
              try {
                const response = await originalFetch.apply(this, arguments);
                if (kind) hideStatus();
                return response;
              } catch (error) {
                if (kind) hideStatus();
                throw error;
              }
            };

            const style = document.createElement('style');
            style.textContent = '.star-status-message{display:inline-flex!important;align-items:center;gap:9px;padding:11px 14px!important;margin-bottom:16px!important;color:#cfc7df!important;background:rgba(124,60,255,.075)!important;border-color:rgba(168,85,247,.22)!important;font-size:13px!important;min-height:22px!important;box-shadow:0 8px 28px rgba(0,0,0,.12)}.star-status-dot{width:7px;height:7px;border-radius:50%;background:#a96cff;box-shadow:0 0 12px rgba(169,108,255,.9);animation:starStatusGlow 1s infinite ease-in-out}.star-status-label{font-weight:700;white-space:nowrap}.star-status-pulse{display:inline-flex;gap:3px;align-items:center}.star-status-pulse i{display:block;width:4px;height:4px;border-radius:50%;background:#c9b5ff;animation:starStatusPulse 1s infinite ease-in-out}.star-status-pulse i:nth-child(2){animation-delay:.16s}.star-status-pulse i:nth-child(3){animation-delay:.32s}@keyframes starStatusGlow{50%{opacity:.35;transform:scale(.7)}}@keyframes starStatusPulse{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}';
            document.head.appendChild(style);
          })();
          </script>'''

          text = text.replace('</body>', script + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('Status indicator injected.')

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add live thinking and image editing indicator"
          git push
