<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAR AI — Giriş</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth"><a class="brand" href="/">✦ STAR AI</a><div class="auth-card"><h1>STAR AI'a Hoş Geldin</h1><p>Hesabını oluştur veya giriş yap.</p><div class="tabs"><button id="loginTab">Giriş Yap</button><button id="registerTab">Kayıt Ol</button></div><form id="form"><input id="name" placeholder="Ad Soyad" style="display:none"><input id="email" type="email" placeholder="E-posta" required><input id="password" type="password" placeholder="Şifre (en az 8 karakter)" required><button class="btn big">Devam Et →</button><div id="err"></div></form></div></main><script>
let mode='login'; const f=document.querySelector('#form'), nameEl=document.querySelector('#name'), err=document.querySelector('#err');
function setMode(m){mode=m;nameEl.style.display=m==='register'?'block':'none';document.querySelector('#loginTab').classList.toggle('on',m==='login');document.querySelector('#registerTab').classList.toggle('on',m==='register')}
document.querySelector('#loginTab').onclick=()=>setMode('login');document.querySelector('#registerTab').onclick=()=>setMode('register');
f.onsubmit=async e=>{e.preventDefault();err.textContent='';const body={email:email.value,password:password.value};if(mode==='register')body.name=nameEl.value;const r=await fetch('/api/auth/'+(mode==='login'?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){err.textContent=d.error;return}location.href='/dashboard.html'};
</script></body></html>
