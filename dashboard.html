<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAR AI — Panel</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/">✦ STAR AI</a><span id="user"></span><button id="logout">Çıkış</button></header><main class="dashboard"><div class="dash-head"><div><span class="eyebrow">KONTROL PANELİ</span><h1>Merhaba! 👋</h1><p>Bugün ne üretmek istersin?</p></div><div class="credits"><small>Kredi</small><b id="credits">—</b></div></div><section class="chat"><div id="messages"><div class="msg ai">Merhaba! Ben STAR AI. Nasıl yardımcı olabilirim?</div></div><form id="chat"><input id="message" placeholder="Mesajınızı yazın…" required><button class="btn">Gönder ↑</button></form></section><section class="plans"><div><b>Basic</b><strong>₺199</strong><button onclick="buy('basic')">Basic'e geç</button></div><div class="popular"><b>Pro</b><strong>₺399</strong><button onclick="buy('pro')">Pro'ya geç</button></div><div><b>Business</b><strong>₺799</strong><button onclick="buy('business')">Business'a geç</button></div></section></main><script>
async function load(){const r=await fetch('/api/me');if(!r.ok){location.href='/login.html';return}const d=await r.json();user.textContent=d.user.name;credits.textContent=d.user.credits}
chat.onsubmit=async e=>{e.preventDefault();const t=message.value.trim();if(!t)return;messages.insertAdjacentHTML('beforeend','<div class="msg user"></div>');messages.lastElementChild.textContent=t;message.value='';const p=document.createElement('div');p.className='msg ai';p.textContent='STAR AI düşünüyor…';messages.appendChild(p);const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});const d=await r.json();p.textContent=d.answer||d.error;if(d.credits!==undefined)credits.textContent=d.credits}
logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/'}
async function buy(plan){const r=await fetch('/api/billing/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan})});const d=await r.json();if(!r.ok){alert(d.error);return}if(d.paymentPageUrl)location.href=d.paymentPageUrl;else if(d.checkoutFormContent){const w=window.open();w.document.write(d.checkoutFormContent)}}
load();
</script></body></html>
