    <path d="M-10 153 C48 95 96 64 151 65 C190 66 215 82 236 103" stroke="#284fff" stroke-width="8" opacity=".78"/>
    <path d="M20 218 C55 160 89 125 130 104 C163 87 194 84 224 94" stroke="url(#arc)" stroke-width="10" opacity=".82"/>
    <path d="M63 214 C78 165 101 125 130 91 C148 70 166 54 186 44" stroke="#d8e2ff" stroke-width="5" opacity=".9"/>
    <path d="M102 213 C113 164 126 128 148 96 C163 74 181 56 201 42" stroke="#647eff" stroke-width="4" opacity=".85"/>
  </g>
  <path d="M110 39 L116 57 L135 58 L120 69 L125 88 L110 77 L95 88 L100 69 L85 58 L104 57 Z" fill="url(#star)" filter="url(#glow)"/>
