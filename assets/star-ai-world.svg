 <path d="M-16 106 C38 64 79 42 120 43 C158 43 191 57 239 80" stroke="url(#red)" stroke-width="7" filter="url(#glow)"/>
 <path d="M-22 140 C32 105 72 89 111 89 C154 89 197 105 241 132" stroke="url(#blue)" stroke-width="8" filter="url(#glow)"/>
 <path d="M-16 156 C40 124 76 110 116 112 C161 114 194 131 237 153" stroke="#75eaff" stroke-width="2.2" opacity=".85"/>
 <path d="M-12 81 C42 45 80 29 121 31 C167 33 203 50 238 67" stroke="#ff6377" stroke-width="2" opacity=".75"/>
</g>
