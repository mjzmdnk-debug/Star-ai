<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
<title id="title">TR AI — Dynamic Crescent</title>
<desc id="desc">A polished Turkish crescent and star with aerodynamic red and electric blue energy trails.</desc>
<defs>
 <radialGradient id="bg" cx="38%" cy="32%" r="80%"><stop stop-color="#19234f"/><stop offset=".58" stop-color="#080d22"/><stop offset="1" stop-color="#03050d"/></radialGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb5bd"/><stop offset=".22" stop-color="#ff334f"/><stop offset=".62" stop-color="#d9002b"/><stop offset="1" stop-color="#650018"/></linearGradient>
 <linearGradient id="white" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#dceaff"/><stop offset="1" stop-color="#8498c8"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ef7ff"/><stop offset=".45" stop-color="#147bff"/><stop offset="1" stop-color="#6d3dff"/></linearGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
 <clipPath id="disc"><circle cx="110" cy="110" r="101"/></clipPath>
</defs>
<circle cx="110" cy="110" r="107" fill="#040713" stroke="url(#blue)" stroke-width="2"/>
<circle cx="110" cy="110" r="101" fill="url(#bg)" stroke="#a6d7ff" stroke-opacity=".24"/>
<g clip-path="url(#disc)" fill="none" stroke-linecap="round">
