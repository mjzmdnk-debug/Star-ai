 <path d="M105 42 A66 66 0 1 0 161 146 A52 52 0 1 1 105 42 Z" fill="none" stroke="url(#red)" stroke-width="3"/>
 <path d="M157 75 L166 96 L189 97 L171 111 L177 134 L157 121 L137 134 L143 111 L125 97 L148 96 Z" fill="url(#white)" stroke="#fff" stroke-width="1.5"/>
</g>
<circle cx="110" cy="110" r="102" fill="none" stroke="#d6f3ff" stroke-opacity=".22"/>
</svg>