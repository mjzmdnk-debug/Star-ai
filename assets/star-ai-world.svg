    <radialGradient id="bg" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#263b9b"/>
      <stop offset="0.52" stop-color="#11145a"/>
      <stop offset="1" stop-color="#070718"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a8ff"/>
