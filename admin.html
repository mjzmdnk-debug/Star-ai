<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAR AI — Admin</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><a class="brand" href="/">✦ STAR AI <small style="color:#9a6cff">ADMIN</small></a><div><a class="btn" href="/dashboard.html">Panele Dön</a> <button class="btn" id="logout">Çıkış</button></div></header>
<main class="dashboard admin"><div class="dash-head"><div><span class="eyebrow">YÖNETİM MERKEZİ</span><h1>STAR AI Yönetim Paneli</h1><p>Üyeler, Credits, planlar ve gelir görünümü.</p></div></div>
<div id="cards" class="admin-cards"></div>
<section class="admin-panel"><div class="admin-toolbar"><h2>Kullanıcılar</h2><input id="search" maxlength="100" placeholder="Ad veya e-posta ara…"></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Kullanıcı</th><th>Plan</th><th>Credits</th><th>Rol</th><th>İşlem</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="admin-panel"><h2>Plan Dağılımı</h2><div id="plans" class="plan-bars"></div></section></main>
<script>
const $=id=>document.getElementById(id); const fmt=n=>new Intl.NumberFormat('tr-TR').format(Number(n)||0);
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Hata');return d}
async function load(){try{const me=await api('/api/me');if(me.user.role!=='admin'){location.href='/dashboard.html';return;}const d=await api('/api/admin/overview');
$('cards').replaceChildren(...[
 ['Toplam Kullanıcı',d.stats.users],['Ücretli Kullanıcı',d.stats.paid],['Dolaşımdaki Credits',d.stats.credits],['AI Kullanım Credits',d.stats.usage],['Aylık Plan Değeri*','₺'+fmt(d.stats.revenue)]
].map(([label,value])=>{const el=document.createElement('div'),s=document.createElement('small'),b=document.createElement('b');s.textContent=label;b.textContent=value;el.append(s,b);return el}));
$('plans').replaceChildren(...(d.byPlan||[]).map(x=>{const el=document.createElement('div'),s=document.createElement('span'),b=document.createElement('b');s.textContent=x.plan;b.textContent=fmt(x.count);el.append(s,b);return el}));await loadUsers();
}catch(e){alert(e.message);location.href='/';}}
async function loadUsers(){try{const q=encodeURIComponent($('search').value||'');const d=await api('/api/admin/users?q='+q);$('users').replaceChildren(...(d.rows||[]).map(u=>{const tr=document.createElement('tr');
const tdId=document.createElement('td');tdId.textContent=u.id;const tdUser=document.createElement('td');const name=document.createElement('b');name.textContent=u.name;const email=document.createElement('small');email.textContent=u.email;tdUser.append(name,email);
const tdPlan=document.createElement('td');const select=document.createElement('select');for(const p of ['free','basic','pro','business']){const option=document.createElement('option');option.value=p;option.textContent=p;option.selected=p===u.plan;select.append(option);}select.addEventListener('change',()=>setPlan(u.id,select.value));tdPlan.append(select);
const tdCredits=document.createElement('td');tdCredits.textContent=fmt(u.credits);const tdRole=document.createElement('td');tdRole.textContent=u.role;const tdAction=document.createElement('td');const button=document.createElement('button');button.textContent='+ Credits';button.addEventListener('click',()=>addCredits(u.id));tdAction.append(button);tr.append(tdId,tdUser,tdPlan,tdCredits,tdRole,tdAction);return tr;}));}catch(e){alert(e.message)}}
async function addCredits(id){const n=prompt('Eklenecek (+) veya düşülecek (-) Credits miktarı:');if(n===null)return;const amount=Number(n);if(!Number.isInteger(amount)||amount===0){alert('Geçerli bir tam sayı girin.');return;}try{await api('/api/admin/users/'+encodeURIComponent(id)+'/credits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount})});await load();}catch(e){alert(e.message)}}
async function setPlan(id,plan){try{await api('/api/admin/users/'+encodeURIComponent(id)+'/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan})});await load();}catch(e){alert(e.message);await loadUsers()}}
let searchTimer; $('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadUsers,250)});$('logout').addEventListener('click',async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/'});load();
</script></body></html>
