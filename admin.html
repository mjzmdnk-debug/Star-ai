<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TR AI — Admin</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><a class="brand" href="/">✦ TR AI <small style="color:#9a6cff">ADMIN</small></a><div><a class="btn" href="/dashboard.html">Panele Dön</a> <button class="btn" id="logout">Çıkış</button></div></header>
<main class="dashboard admin"><div class="dash-head"><div><span class="eyebrow">YÖNETİM MERKEZİ</span><h1>TR AI Yönetim Paneli</h1><p>Üyeler, Credits, planlar ve gelir görünümü.</p></div></div>
<div id="cards" class="admin-cards"></div>
<section class="admin-panel"><div class="admin-toolbar"><h2>Kullanıcılar</h2><input id="search" maxlength="100" placeholder="Ad veya e-posta ara…"></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Kullanıcı</th><th>Plan</th><th>Credits</th><th>Rol</th><th>İşlem</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section class="admin-panel"><h2>Plan Dağılımı</h2><div id="plans" class="plan-bars"></div></section></main>
<div id="creditsModal" role="dialog" aria-modal="true" aria-labelledby="creditsTitle" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);padding:20px;align-items:center;justify-content:center"><section style="width:min(420px,100%);padding:24px;border-radius:16px;background:#111827;color:#f8fafc;border:1px solid #ffffff24;box-shadow:0 20px 60px #0008"><h2 id="creditsTitle" style="margin:0 0 8px">Credits ekle</h2><p id="creditsTarget" style="color:#cbd5e1;font-size:14px">Kullanıcı hesabı</p><label for="creditsAmount" style="display:block;margin:14px 0 6px">Eklenecek kredi miktarı</label><input id="creditsAmount" type="number" step="1" min="1" inputmode="numeric" placeholder="5000" style="width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #64748b;background:#0b1220;color:#fff;font-size:16px"><p style="font-size:12px;color:#94a3b8">İşlem uygulandığında kredi miktarı hesabınıza eklenir.</p><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button id="creditsCancel" type="button" class="btn">İptal</button><button id="creditsConfirm" type="button" class="btn">Krediyi ekle</button></div><p id="creditsError" role="alert" style="display:none;color:#fca5a5;font-size:13px"></p></section></div>
<script>
const $=id=>document.getElementById(id); const fmt=n=>new Intl.NumberFormat('tr-TR').format(Number(n)||0);
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Hata');return d}
async function load(){try{const me=await api('/api/me');if(me.user.role!=='admin'){location.href='/dashboard.html';return;}const d=await api('/api/admin/overview');
$('cards').replaceChildren(...[
 ['Toplam Kullanıcı',d.stats.users],['Ücretli Kullanıcı',d.stats.paid],['Dolaşımdaki Credits',d.stats.credits],['AI Kullanım Credits',d.stats.usage],['Kaydedilen Ödemeler','₺'+fmt(d.stats.revenue)]
].map(([label,value])=>{const el=document.createElement('div'),s=document.createElement('small'),b=document.createElement('b');s.textContent=label;b.textContent=value;el.append(s,b);return el}));
$('plans').replaceChildren(...(d.byPlan||[]).map(x=>{const el=document.createElement('div'),s=document.createElement('span'),b=document.createElement('b');s.textContent=x.plan;b.textContent=fmt(x.count);el.append(s,b);return el}));await loadUsers();
}catch(e){alert(e.message);location.href='/';}}
async function loadUsers(){try{const q=encodeURIComponent($('search').value||'');const d=await api('/api/admin/users?q='+q);$('users').replaceChildren(...(d.rows||[]).map(u=>{const tr=document.createElement('tr');
const tdId=document.createElement('td');tdId.textContent=u.id;const tdUser=document.createElement('td');const name=document.createElement('b');name.textContent=u.name;const email=document.createElement('small');email.textContent=u.email;tdUser.append(name,email);
const tdPlan=document.createElement('td');const select=document.createElement('select');for(const p of ['free','basic','pro','business']){const option=document.createElement('option');option.value=p;option.textContent=p;option.selected=p===u.plan;select.append(option);}select.addEventListener('change',()=>setPlan(u.id,select.value));tdPlan.append(select);
const tdCredits=document.createElement('td');tdCredits.textContent=fmt(u.credits);const tdRole=document.createElement('td');tdRole.textContent=u.role;const tdAction=document.createElement('td');const button=document.createElement('button');button.textContent='+ Credits';button.addEventListener('click',()=>addCredits(u.id));tdAction.append(button);tr.append(tdId,tdUser,tdPlan,tdCredits,tdRole,tdAction);return tr;}));}catch(e){alert(e.message)}}
let creditsTargetId=null;function closeCredits(){ $('creditsModal').style.display='none';creditsTargetId=null;$('creditsAmount').value='';$('creditsError').style.display='none';}async function addCredits(id){creditsTargetId=id;$('creditsTarget').textContent='Kullanıcı ID: '+id;$('creditsAmount').value='';$('creditsError').style.display='none';$('creditsModal').style.display='flex';$('creditsAmount').focus();} $('creditsCancel').addEventListener('click',closeCredits);$('creditsModal').addEventListener('click',e=>{if(e.target===$('creditsModal'))closeCredits();});$('creditsConfirm').addEventListener('click',async()=>{const amount=Number($('creditsAmount').value);if(!Number.isInteger(amount)||amount<=0){$('creditsError').textContent='Pozitif bir tam sayı girin.';$('creditsError').style.display='block';return;}const id=creditsTargetId;if(!id)return;$('creditsConfirm').disabled=true;$('creditsConfirm').textContent='İşleniyor…';try{await api('/api/admin/users/'+encodeURIComponent(id)+'/credits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount})});closeCredits();await load();}catch(e){$('creditsError').textContent=e.message;$('creditsError').style.display='block';}finally{$('creditsConfirm').disabled=false;$('creditsConfirm').textContent='Krediyi ekle';}});
async function setPlan(id,plan){try{await api('/api/admin/users/'+encodeURIComponent(id)+'/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan})});await load();}catch(e){alert(e.message);await loadUsers()}}
let searchTimer; $('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadUsers,250)});$('logout').addEventListener('click',async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/'});load();
</script></body></html>
