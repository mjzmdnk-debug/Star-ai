<!doctype html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>STAR AI — Sohbet</title><link rel="stylesheet" href="/styles.css">
<style>
body{margin:0;background:#05050b;color:#e8ecf1;font-family:Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{border-right:1px solid #252b38;padding:18px;display:flex;flex-direction:column;gap:14px}.brand{font-size:22px;color:#fff;text-decoration:none}.brand b{color:#4facfe}.btn,.send{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;background:#4facfe;color:#05050b;font-weight:700}.btn.secondary{background:#202635;color:#fff}.history{overflow:auto;flex:1}.history button{display:block;width:100%;text-align:left;background:#111621;color:#ddd;border:1px solid #252b38;border-radius:8px;padding:10px;margin-bottom:7px;cursor:pointer}.userbox{border-top:1px solid #252b38;padding-top:14px}.main{display:flex;flex-direction:column;min-width:0}.top{padding:18px 24px;border-bottom:1px solid #252b38;display:flex;justify-content:space-between;gap:15px;align-items:center}.top select,.settings input{background:#111621;color:#fff;border:1px solid #303746;border-radius:8px;padding:9px}.messages{flex:1;overflow:auto;padding:24px;max-width:950px;width:100%;box-sizing:border-box;margin:auto}.msg{display:flex;margin:12px 0}.bubble{padding:12px 15px;border-radius:15px;max-width:78%;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{justify-content:flex-end}.msg.user .bubble{background:#4facfe;color:#05050b}.msg.ai{justify-content:flex-start}.msg.ai .bubble{background:#18202d;border:1px solid #2d3748}.composer{padding:18px;display:flex;gap:10px;border-top:1px solid #252b38;max-width:950px;width:100%;box-sizing:border-box;margin:auto}.composer input{flex:1;background:#111621;color:#fff;border:1px solid #303746;border-radius:10px;padding:13px}.status{font-size:13px;color:#9aa5b5}.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.danger{color:#ff9b9b}.loading{opacity:.7}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:12px}.messages,.composer{padding:12px}.bubble{max-width:88%}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><a class="brand" href="/">✦ STAR <b>AI</b></a><button id="newChat" class="btn">+ Yeni sohbet</button><div id="history" class="history"></div><div class="userbox"><div id="user">Kullanıcı</div><div>Bakiye: <b id="credits">—</b></div><button id="logout" class="btn secondary" style="width:100%;margin-top:10px">Çıkış yap</button></div></aside>
<main class="main"><header class="top"><div><strong>STAR AI Asistan</strong><div class="status">Güvenli ve kaydedilen sohbet</div></div><div class="settings"><label>Model <select id="model"><option value="gpt-4o-mini">GPT-4o Mini</option></select></label><label>Yaratıcılık <input id="temperature" type="number" min="0" max="1.5" step="0.1" value="0.7" style="width:65px"></label><label>Maksimum token <input id="maxTokens" type="number" min="100" max="2000" step="100" value="800" style="width:75px"></label></div></header>
<section id="messages" class="messages"></section>
<form id="composer" class="composer"><input id="message" maxlength="12000" autocomplete="off" placeholder="Mesajınızı buraya yazın…" required><button id="send" class="send">Gönder</button></form>
</main></div>
<script>
const $=id=>document.getElementById(id);let conversationId=null,busy=false;
function add(role,text){const row=document.createElement('div');row.className='msg '+(role==='user'?'user':'ai');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.appendChild(bubble);$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight;return bubble}
function welcome(){ $('messages').replaceChildren();add('ai','Merhaba! 👋 Ben STAR AI. Bugün size nasıl yardımcı olabilirim?'); }
async function api(url,options){const r=await fetch(url,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Bir hata oluştu.');return d}
async function loadConversations(){const d=await api('/api/conversations');$('history').replaceChildren();for(const c of d.conversations||[]){const b=document.createElement('button');b.textContent=c.title||'Sohbet';b.onclick=()=>openConversation(c.id);$('history').appendChild(b)}if(!conversationId&&d.conversations?.length)await openConversation(d.conversations[0].id)}
async function openConversation(id){const d=await api('/api/conversations/'+encodeURIComponent(id)+'/messages');conversationId=id;$('messages').replaceChildren();for(const m of d.messages||[])add(m.role,m.content);if(!d.messages?.length)welcome()}
async function load(){try{const d=await api('/api/me');$('user').textContent=d.user.name;$('credits').textContent=d.user.credits;await loadConversations();if(!conversationId)welcome()}catch{location.href='/login.html'}}
$('newChat').onclick=async()=>{try{const d=await api('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'Yeni sohbet'})});await loadConversations();await openConversation(d.id)}catch(e){alert(e.message)}};
$('composer').onsubmit=async e=>{e.preventDefault();if(busy)return;const text=$('message').value.trim();if(!text)return;busy=true;$('send').disabled=true;add('user',text);$('message').value='';const pending=add('ai','Düşünüyorum…');pending.classList.add('loading');try{const d=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,conversation_id:conversationId||undefined,model:$('model').value,temperature:Number($('temperature').value),max_tokens:Number($('maxTokens').value)})});pending.textContent=d.answer;pending.classList.remove('loading');conversationId=d.conversation_id;$('credits').textContent=d.credits;await loadConversations()}catch(err){pending.textContent='❌ '+err.message;pending.classList.remove('loading')}finally{busy=false;$('send').disabled=false;$('message').focus()}};
$('logout').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='/'}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')$('composer').requestSubmit()});load();
</script>
</body></html>
